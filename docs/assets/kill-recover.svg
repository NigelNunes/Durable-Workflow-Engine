<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="Kill a worker; workflows resume">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="720" height="280" fill="url(#bg)"/>
  <text x="36" y="48" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">Durable Flow</text>
  <text x="36" y="78" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">kill a worker → lease expires → another worker resumes</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <rect x="36" y="110" width="140" height="56" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="56" y="144" fill="#f85149">worker A ✕</text>
    <rect x="220" y="110" width="140" height="56" rx="8" fill="#21262d" stroke="#3fb950"/>
    <text x="240" y="144" fill="#3fb950">worker B ✓</text>
    <rect x="404" y="110" width="280" height="56" rx="8" fill="#21262d" stroke="#58a6ff"/>
    <text x="424" y="134" fill="#58a6ff">order_fulfilment</text>
    <text x="424" y="154" fill="#8b949e">history replay · no double charge</text>
  </g>
  <text x="36" y="220" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">At-least-once activities · idempotency keys · fencing tokens</text>
  <text x="36" y="250" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Local demo: make demo · Live URL: Phase 13</text>
</svg>
